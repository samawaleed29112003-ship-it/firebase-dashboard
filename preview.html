<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>LDR Dashboard</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
  body {
    margin: 0;
    background: #0d0d0d;
    color: white;
    font-family: Arial;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  h1 {
    margin-top: 20px;
  }

  .dashboard {
    display: flex;
    gap: 20px;
    margin-top: 30px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .card {
    background: #1a1a1a;
    padding: 20px;
    border-radius: 15px;
    width: 220px;
    text-align: center;
    box-shadow: 0 0 15px rgba(255,255,255,0.08);
  }

  .value {
    font-size: 2em;
    margin-top: 10px;
  }

  .bright { color: #00ff88; }
  .dark { color: #ffaa00; }

  .clock {
    margin-top: 10px;
    opacity: 0.7;
  }
</style>
</head>

<body>

<h1>💡 LDR Light Dashboard</h1>

<div class="clock" id="localClock"></div>

<div class="dashboard">

  <div class="card">
    <h3>LDR Value</h3>
    <div class="value" id="ldr">--</div>
  </div>

  <div class="card">
    <h3>Status</h3>
    <div class="value" id="status">--</div>
  </div>

  <div class="card">
    <h3>Last Update</h3>
    <div class="value" id="time">--</div>
  </div>

</div>

<script>
  // 🔥 YOUR FIREBASE CONFIG
  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "test-9e630.firebaseapp.com",
    databaseURL: "https://test-9e630-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "test-9e630",
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  const sensorRef = db.ref("sensor");

  sensorRef.on("value", (snapshot) => {
    const data = snapshot.val();

    if (!data) return;

    const ldr = data.ldr;
    const time = data.time;

    document.getElementById("ldr").innerText = ldr;
    document.getElementById("time").innerText = time;

    const statusEl = document.getElementById("status");

    // 🌗 Light logic (adjust threshold if needed)
    if (ldr < 2000) {
      statusEl.innerText = "🌙 Dark";
      statusEl.className = "value dark";
    } else {
      statusEl.innerText = "☀️ Bright";
      statusEl.className = "value bright";
    }
  });

  // 🕒 Local clock
  function updateClock() {
    const now = new Date();
    document.getElementById("localClock").innerText =
      now.toLocaleDateString() + " | " + now.toLocaleTimeString();
  }

  setInterval(updateClock, 1000);
  updateClock();
</script>

</body>
</html>
